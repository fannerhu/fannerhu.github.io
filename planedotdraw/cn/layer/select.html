<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>面点绘图——矢量绘图工具</title>
    </head>
    <body>
        <div style="width:100%">
            <div style="background-color: rgb(32, 32, 32);height: 40px;">
                <img style="padding-left: 10px; float:left; padding-top: 4px;" src="../../images/icon.png" width="32" height="32">
                <a style="color:azure;text-decoration: none;float:left; padding-left: 10px; padding-top: 7px;" href="../index.html">面点绘图</a>
                <a style="color:azure;text-decoration: none;float:right; padding-right: 20px;padding-top: 10px;" 
                href="../../en/layer/select.html">English</a>
                <a style="color:azure;text-decoration: none;float:right; padding-right: 10px;padding-top: 7px;" href="../doc.html">文档</a>
            </div>
            <div style="padding-bottom: 30px; padding-top: 20px;">
            <div style="width:50%;float:left;">
                <a style="padding-left: 100px;" href="newGroup.html">前一页</a>
            </div>
            <div style="width:50%;float:left;">
                <a style="float: right; padding-right: 100px;" href="multiSelect.html">后一页</a>
            </div>  
            </div>
            <div style="background-color:rgb(255, 255, 255); padding-left: 100px; padding-bottom: 50px; ">
                    <h3>选中图层或组</h3>
                    <h4>应用版本：1.07</h4>
                    1. <a href="../ui/showLayerPanel.html" style = "padding-left: 4px;">显示图层面板</a>。
                <p style="padding-left: 20px;">
                    单击各项（图层或组）即可更改其选中状态。</br>
                    选中的项（图层或组），背景色为橙色。
                </p>
                <div style="display: flex; align-items: center; padding-top: 10px;">
                    2. 单击图层选择图标<img style="padding-left: 5px;" src="../../images/tap.png" height="32">，可以开启或者关闭图层选择模式。
                </div>
                    <p style="padding-left: 20px;">
                    当处于图层选择模式时：</br>
                    图层选择图标背景色为橙色。</br>
                    单击画布上的图形，可以选中图形。</br>
                    单击画布上空白处，可以选中画布。</br>
                    单击画布周围空白处，可以取消选中图层和组。（这个方法有时候无效，和画布尺寸有关系。）
                    </p>
            </div>
            <div style="background-color:rgb(32, 32, 32); height: 40px;clear:both">
                <center style = "padding-top: 7px;">
                    <a style="color:azure;text-decoration: none;padding-right: 15px;" href="../support.html">支持</a>
                    <a style="color:azure;text-decoration: none;padding-left: 15px;" href="../policy.html">隐私政策</a>
                </center>
            </div>
        </div>
    </body>
</html>
