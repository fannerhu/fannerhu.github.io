                    图形是信息的直观表达。<br>
                    面点绘图可以用来绘制图形。<br>
                    目前只有iPad版本。<br>
                    <br>
                    主要功能：<br>
                    可编辑的矢量绘图：移动、旋转、缩放、翻转、排列以及编辑边线宽度、边线颜色、填充颜色等。<br>
                    复制、隐藏、删除图层；拖拽图层以改变其顺序。<br>
                    拖拽资源到画布。<br>
                    移动端点来修改形状的轮廓。<br>
                    通过输入数据来生成维诺图、饼图等。<br>
                    组合形状：并集，差集，交集，对称差集。<br>
                    JPEG和PNG导入导出。<br>
                    图形文件创建、保存、打开和导入。
